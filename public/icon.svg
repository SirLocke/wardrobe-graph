    stroke="#18181B"
    stroke-width="6"
    stroke-linejoin="round"
  />
  <!-- Left Lapel Fold -->
  <path
    d="M218 164L192 214L212 220L238 258"
    stroke="#52525B"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Right Tailored Overshirt / Jacket Panel -->
  <path
    d="M336 178L294 164L274 242L278 374H346V242L368 334L404 324L380 204C377 191 367 182 354 179L336 178Z"
    fill="url(#jacketRight)"
    stroke="#18181B"
    stroke-width="6"
    stroke-linejoin="round"
  />
  <!-- Right Lapel Fold -->
  <path
    d="M294 164L320 214L300 220L274 258"
    stroke="#3F3F46"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Subtle Breast Pocket on Right Panel -->
  <rect x="294" y="266" width="34" height="36" rx="6" fill="#D4D4D8" stroke="#52525B" stroke-width="4"/>

  <!-- Signature 4-Segment Outfit Color Harmony Bar at Bottom -->
  <rect x="116" y="416" width="64" height="20" rx="10" fill="#8F9779"/>
  <rect x="188" y="416" width="64" height="20" rx="10" fill="#E3D4C0"/>
  <rect x="260" y="416" width="64" height="20" rx="10" fill="#FBBF24"/>
  <rect x="332" y="416" width="64" height="20" rx="10" fill="#60A5FA"/>
