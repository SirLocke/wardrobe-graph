    </linearGradient>
    <linearGradient id="jacketRight" x1="252" y1="165" x2="392" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E4E4E7"/>
      <stop offset="100%" stop-color="#A1A1AA"/>
    </linearGradient>
    <linearGradient id="innerTee" x1="216" y1="185" x2="296" y2="372" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9CA986"/>
      <stop offset="100%" stop-color="#6F7D5C"/>
    </linearGradient>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="116" fill="url(#amberGlow)"/>

  <!-- Subtle Studio Frame Rim -->
  <rect x="20" y="20" width="472" height="472" rx="98" stroke="#27272A" stroke-width="4"/>
  <rect x="24" y="24" width="464" height="464" rx="94" stroke="#FBBF24" stroke-opacity="0.18" stroke-width="2"/>

  <!-- Golden Coat Hanger Hook & Shoulder Bridge -->
  <path
    d="M256 76C275.882 76 292 91.67 292 111C292 126.4 281.4 139.2 266.5 143.8L256 147V168"
    stroke="url(#goldGrad)"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M174 192L256 154L338 192"
    stroke="url(#goldGrad)"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Inner Layered Base-Top (Sage Green) -->
  <path
    d="M206 188L256 206L306 188V372H206V188Z"
    fill="url(#innerTee)"
  />
  <path
    d="M218 188C230 206 282 206 294 188"
    stroke="#E4E4E7"
    stroke-opacity="0.55"
    stroke-width="6"
    stroke-linecap="round"
  />

  <!-- Left Tailored Overshirt / Jacket Panel -->
  <path
    d="M176 178L218 164L238 242L234 374H166V242L144 334L108 324L132 204C135 191 145 182 158 179L176 178Z"
